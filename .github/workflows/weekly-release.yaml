name: Weekly Release PR Merge

on:
  schedule:
    - cron: '0 22 * * 6' # Sunday 07:00 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  merge:
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    uses: Soli0222/shared-workflows/.github/workflows/weekly-merge.yaml@v1.2.0
    secrets: inherit
