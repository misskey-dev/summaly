name: Retry Release Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'やり直す release の version (先頭の v は付けない。例: 1.4.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  retry:
    permissions:
      contents: write
      pull-requests: write
      packages: write
    uses: Soli0222/shared-workflows/.github/workflows/release-retry.yaml@v1.3.0
    secrets: inherit
    with:
      version: ${{ inputs.version }}
