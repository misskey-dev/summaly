name: Release Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pipeline-${{ github.repository }}
  queue: max

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      packages: write
    uses: Soli0222/shared-workflows/.github/workflows/release-pipeline.yaml@v1.3.1
    secrets: inherit
    with:
      release-tools-prefix: scripts/release
      node-version: '26.13.1'
      api-versions: monitoring.coreos.com/v1
