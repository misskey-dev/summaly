name: Publish Helm Chart

on:
  push:
    branches: [master]
    paths:
      - 'charts/**'
  schedule:
    - cron: '17 19 * * *' # Daily 04:17 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: write
      packages: write
    uses: Soli0222/shared-workflows/.github/workflows/chart-release.yaml@v1.3.0
    secrets: inherit
    with:
      api-versions: monitoring.coreos.com/v1
