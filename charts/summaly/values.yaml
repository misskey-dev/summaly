# Default values for summaly.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Application metadata
nameOverride: ""
fullnameOverride: ""

# Image configuration
image:
  repository: ghcr.io/soli0222/summaly
  # -- Defaults to Chart.appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Deployment configuration
replicaCount: 1

# Container configuration
containerPort: 3000

# -- Inject Kubernetes service links (`<SERVICE>_PORT` etc.) into the pod.
# Off by default: a Service named `summaly` sets `SUMMALY_PORT=tcp://...`, which
# the server reads as its listen port and exits.
enableServiceLinks: false

# Pod security context
podSecurityContext: {}
  # fsGroup: 2000

# Container security context
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

# Liveness probe configuration
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

# Readiness probe configuration
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: summaly.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: summaly-tls
  #    hosts:
  #      - summaly.local

# Resource configuration
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Environment variables
env:
  - name: NODE_ENV
    value: "production"
  - name: SUMMALY_RESPONSE_TIMEOUT
    value: "40000"
  - name: SUMMALY_OPERATION_TIMEOUT
    value: "90000"
